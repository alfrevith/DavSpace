<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POT-C · Interactive 3D model</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <model-viewer src="Basurero.glb" alt="POT-C smart bin prototype" camera-controls touch-action="pan-y" interaction-prompt="none" camera-orbit="45deg 70deg auto" shadow-intensity="0.5" environment-image="neutral" loading="eager"></model-viewer>
  <p id="status" role="status">Loading 3D model…</p>
  <div class="controls"><p>Drag to rotate · Pinch or scroll to zoom</p><button id="reset" type="button" disabled>Reset view</button></div>
  <script type="module" src="viewer.js"></script>
</body>
</html>
