<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Informatics | David Menjivar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: "#f5f5f1",
            muted: "#b4b7c3",
            dim: "#747986",
            night: "#07080b",
            cyanSoft: "#93e7ff",
            greenSoft: "#a7f3c5"
          },
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            mono: ["SFMono-Regular", "Consolas", "Liberation Mono", "monospace"]
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen bg-night text-ink font-sans">
  <main class="world-tech relative min-h-screen overflow-hidden px-6 py-8 sm:px-10 lg:px-16">
    <div class="relative z-10 mx-auto max-w-7xl">
      <header class="flex flex-wrap items-center justify-between gap-4 border-b border-white/10 pb-6">
        <a class="font-mono text-sm text-cyanSoft" href="index.html#skills">&lt;- back to skills</a>
        <span class="rounded-full border border-cyanSoft/20 px-4 py-2 font-mono text-xs uppercase text-muted">informatics gallery</span>
      </header>

      <section class="grid gap-8 py-14 lg:grid-cols-[.78fr_1.22fr] lg:items-end">
        <div>
          <p class="mb-4 font-mono text-xs uppercase text-greenSoft">Systems / code / visual proof</p>
          <h1 class="text-balance text-5xl font-black leading-none sm:text-6xl lg:text-7xl">Technical work as a living lab.</h1>
        </div>
        <p class="max-w-3xl text-lg leading-8 text-muted">
          Use this page to collect screenshots of builds, UI experiments, diagrams, notes, school projects, and visual
          documentation of how you solve technical problems.
        </p>
      </section>

      <section class="grid auto-rows-[260px] gap-5 md:grid-cols-4">
        <figure class="gallery-frame tech-frame md:col-span-2 md:row-span-2">
          <img src="" alt="Informatics gallery item" data-empty />
          <span>main build screenshot</span>
        </figure>
        <figure class="gallery-frame tech-frame md:col-span-2">
          <img src="" alt="Informatics gallery item" data-empty />
          <span>interface experiment</span>
        </figure>
        <figure class="gallery-frame tech-frame">
          <img src="" alt="Informatics gallery item" data-empty />
          <span>code note</span>
        </figure>
        <figure class="gallery-frame tech-frame">
          <img src="" alt="Informatics gallery item" data-empty />
          <span>system diagram</span>
        </figure>
        <figure class="gallery-frame tech-frame md:col-span-2">
          <img src="" alt="Informatics gallery item" data-empty />
          <span>prototype result</span>
        </figure>
      </section>
    </div>
  </main>
</body>
</html>
